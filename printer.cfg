# Printrbot Simple Metal, SKR Mini E3 V2.0, Klipper on a BeagleBone Black.
#
# Pin map is the official Klipper SKR Mini E3 V2.0 map (STM32F103).
# Do not use a V3.0 config on this board. The Printrbot Plus has a V3.0
# and is a separate machine.
#
# Motion, thermistors, PID, and the probe are carried from the Marlin
# 2.1.1.1 Configuration.h that was last saved for the Plus. The Simple
# Metal header was overwritten. These values match the usual Printrbot
# figures. An M503 dump from the running printer replaces them if it
# disagrees.
#
# Before the first heat or the first Z home:
#   1. Compile Klipper for STM32F103, 28KiB bootloader, USB, and set
#      "GPIO pins to set at micro-controller startup" to !PA14.
#      Copy out/klipper.bin to firmware.bin on the SD card and reboot.
#   2. Set the [mcu] serial path from /dev/serial/by-id/.
#   3. QUERY_ENDSTOPS with each switch open and pressed. A switch that
#      reads backwards needs the "!" added or removed on that pin.
#   4. QUERY_PROBE with the probe pressed and released before homing Z.
#      Keep a hand on the power switch for the first Z home.
#   5. If the heatsink fan is plugged into FAN1 (PC7), uncomment
#      [heater_fan hotend_fan] before heating. Marlin left that pin unused.
#   6. Calibrate probe z_offset before a mesh or a print. It is 0 here.
#   7. Put the BTT TFT into Marlin / 12864 emulation mode. Touch mode
#      will not speak this display section.

[stepper_x]
step_pin: PB13
# Motor direction is the opposite of Marlin INVERT_X_DIR false, so G-code
# +X matches the slicer and parts are not mirrored. The switch is still
# at the same physical end. That end is now X max, so homing moves
# toward the switch and stops at 152.4. +X jogs toward the switch.
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
# 80 steps/mm at 16 microsteps.
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 152.4
position_min: 0
position_max: 152.4
homing_speed: 50
homing_retract_dist: 5
second_homing_speed: 25

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
# Marlin compiled 800 mA RMS, hold multiplier 0.5. EEPROM M906 may differ.
run_current: 0.800
hold_current: 0.400
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
# Marlin INVERT_Y_DIR false.
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_min: 0
position_max: 152.4
homing_speed: 50
homing_retract_dist: 5
second_homing_speed: 25

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.800
hold_current: 0.400
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
# Marlin INVERT_Z_DIR true. One Z motor.
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
# 2020 steps/mm at 16 microsteps.
rotation_distance: 1.584158
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 152.4
homing_speed: 4
homing_retract_dist: 2
second_homing_speed: 1

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.800
hold_current: 0.400
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
# Marlin INVERT_E0_DIR false.
dir_pin: PB4
enable_pin: !PD2
microsteps: 16
# 94.5 steps/mm at 16 microsteps. Calibrated value from the Marlin file.
rotation_distance: 33.862434
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
# Marlin TEMP_SENSOR_0 1, 100k EPCOS, 4.7k pullup.
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
# Reported temperature and the PID derivative window. The proportional
# term still sees each sample, so a long spike can still move the heater.
# max_temp below is the hard cutoff. A 0.1 uF capacitor across the
# thermistor is the hardware half of this fix.
smooth_time: 3.0
control: pid
pid_Kp: 40.15
pid_Ki: 7.10
pid_Kd: 56.73
min_temp: 0
# Marlin faulted at 285 and refused targets above 270. 270 faults a
# sustained reading that a +50 C spike from PETG (235 C) would reach.
max_temp: 270
min_extrude_temp: 170
max_extrude_only_distance: 200

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.800
hold_current: 0.400
stealthchop_threshold: 999999

[verify_heater extruder]
max_error: 120
check_gain_time: 40
hysteresis: 15
heating_gain: 2

# Pressure advance is not set. Tune it on flexible filament before
# putting a number here:
#   [extruder]
#   pressure_advance: 0.0
#   pressure_advance_smooth_time: 0.040

[heater_bed]
heater_pin: PC9
# Marlin TEMP_SENSOR_BED 7.
sensor_type: Honeywell 100K 135-104LAG-J01
sensor_pin: PC3
control: pid
pid_Kp: 30.65
pid_Ki: 5.69
pid_Kd: 109.42
# Marlin MAX_BED_POWER 170/255.
max_power: 0.667
min_temp: 0
max_temp: 130

# Part cooling. Marlin FAN_PIN.
[fan]
pin: PC6

# Uncomment only if the Ubis heatsink fan is wired to FAN1.
# [heater_fan hotend_fan]
# pin: PC7
# heater: extruder
# heater_temp: 50

[probe]
# Marlin FIX_MOUNTED_PROBE on Z_MIN_PROBE_PIN PC14, offset {20, 0, 0}
# in the old X direction. Reversing X flips that sign. z_offset 0 is
# the compile default, not a measured nozzle offset.
pin: ^PC14
x_offset: -20
y_offset: 0
z_offset: 0
speed: 2
lift_speed: 5
samples: 3
samples_result: median
sample_retract_dist: 1

[safe_z_home]
home_xy_position: 76.2, 76.2
speed: 50
z_hop: 3
z_hop_speed: 4

[bed_mesh]
speed: 150
horizontal_move_z: 3
# Nozzle coordinates. With x_offset -20 the probe is 20 mm toward X0,
# so the nozzle cannot mesh below X 30 or the probe leaves the bed.
mesh_min: 30, 10
mesh_max: 152.4, 142.4
probe_count: 3, 3
algorithm: lagrange

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_REPLACE_ME-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 1000
max_z_velocity: 7
max_z_accel: 150
# Marlin classic jerk was 10 mm/s on X and Y.
square_corner_velocity: 10

[static_digital_output usb_pullup_enable]
pins: !PA14

[board_pins]
aliases:
    # EXP1 header, SKR Mini E3 V2.0
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8,  EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB15, EXP1_10=<5V>,
    # TFT touch-mode serial. PA3 is only a dummy MISO for the emulator.
    TFT_TX=PA2, TFT_RX=PA3

# BTT TFT in 12864 emulation, same EXP1 wiring as Marlin CR10_STOCKDISPLAY
# on this board. Tested shape from the NoTouchScreenFirmware wiki for
# TFT35 E3 on SKR Mini E3 V2.0. Switch the TFT to emulation mode first.
[display]
lcd_type: emulated_st7920
en_pin: EXP1_7
spi_software_sclk_pin: EXP1_6
spi_software_mosi_pin: EXP1_8
spi_software_miso_pin: TFT_RX
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

[output_pin beeper]
pin: EXP1_1

# Input shaping is intentionally absent. Wire the ADXL345 to the
# BeagleBone, measure X and Y, then add [input_shaper] with the results.
# A BeagleBone SPI accelerometer looks like:
#   [mcu rpi]
#   serial: /tmp/klipper_host_mcu
#   [adxl345]
#   cs_pin: rpi:None
#   spi_bus: spidev1.1
# Use the bus that the wiring actually lands on.
